<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="title">
  <title id="title">Kirill Persionov — Head of Development, .NET</title>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070b12"/>
      <stop offset="0.55" stop-color="#0d1422"/>
      <stop offset="1" stop-color="#16203a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#58a6ff"/>
      <stop offset="1" stop-color="#a371f7"/>
    </linearGradient>
    <linearGradient id="topline" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#58a6ff" stop-opacity="0"/>
      <stop offset="0.35" stop-color="#58a6ff" stop-opacity="0.8"/>
      <stop offset="0.65" stop-color="#a371f7" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#a371f7" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1"/>
    </pattern>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#4c8dff" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#4c8dff" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="panelClip">
      <rect x="690" y="44" width="460" height="206" rx="14"/>
    </clipPath>

    <style><![CDATA[
      .in  { animation: fadeUp .85s cubic-bezier(.22,.7,.3,1) both; }
      .d1  { animation-delay: .05s; }
      .d2  { animation-delay: .18s; }
      .d3  { animation-delay: .32s; }
      .d4  { animation-delay: .46s; }
      @keyframes fadeUp {
        from { opacity: 0; transform: translateY(12px); }
        to   { opacity: 1; transform: translateY(0); }
      }

      .type { animation: type 1.7s steps(29, end) 1.05s both; }
      @keyframes type {
        from { clip-path: inset(0 100% 0 0); }
        to   { clip-path: inset(0 0 0 0); }
      }
      .caret { animation: blink 1.1s steps(1, end) 2.8s infinite both; }
      @keyframes blink { 0%,49% { opacity: 1; } 50%,100% { opacity: 0; } }

      .live { animation: pingle 2.2s ease-in-out infinite; }
      @keyframes pingle { 0%,100% { opacity: 1; } 50% { opacity: .3; } }

      .bar  { animation: wave 3.2s ease-in-out infinite; }
      .b1 { animation-delay: 0s;    }
      .b2 { animation-delay: .22s;  }
      .b3 { animation-delay: .44s;  }
      .b4 { animation-delay: .66s;  }
      .b5 { animation-delay: .88s;  }
      @keyframes wave {
        0%, 100% { opacity: .35; }
        38%      { opacity: 1;   }
      }

      .sweep { animation: sweep 6s linear 1.6s infinite; }
      @keyframes sweep {
        from { transform: translateX(0); }
        to   { transform: translateX(440px); }
      }

      @media (prefers-reduced-motion: reduce) {
        .in, .type, .caret, .live, .bar, .sweep { animation: none; }
        .type  { clip-path: none; }
        .caret { opacity: 1; }
      }
    ]]></style>
  </defs>

  <rect width="1200" height="320" fill="url(#bg)"/>
  <rect width="1200" height="320" fill="url(#grid)"/>
  <ellipse cx="960" cy="150" rx="380" ry="230" fill="url(#glow)"/>
  <rect x="0" y="0" width="1200" height="2" fill="url(#topline)"/>

  <!-- left column -->
  <g class="in d1">
    <text x="72" y="98" font-family="'Segoe UI',-apple-system,'Helvetica Neue',Arial,sans-serif"
          font-size="13" font-weight="600" letter-spacing="3.4" fill="#58a6ff">HEAD OF DEVELOPMENT · .NET</text>
  </g>

  <g class="in d2">
    <text x="70" y="162" font-family="'Segoe UI',-apple-system,'Helvetica Neue',Arial,sans-serif"
          font-size="56" font-weight="700" letter-spacing="-1.4" fill="#e6edf3">Kirill Persionov</text>
  </g>

  <g class="in d3">
    <text x="72" y="202" font-family="'Segoe UI',-apple-system,'Helvetica Neue',Arial,sans-serif"
          font-size="19" fill="#8b949e">12 years of .NET in production — and still shipping</text>
    <rect x="72" y="222" width="168" height="3" rx="1.5" fill="url(#accent)"/>
  </g>

  <g class="in d4">
    <g class="type">
      <text x="72" y="262" font-family="ui-monospace,SFMono-Regular,Consolas,'Liberation Mono',monospace"
            font-size="13" fill="#6e7681">dotnet add package DotNetScope</text>
    </g>
    <rect class="caret" x="300" y="251" width="7" height="14" rx="1" fill="#58a6ff"/>
  </g>

  <!-- product panel -->
  <g class="in d4">
    <rect x="690" y="44" width="460" height="206" rx="14" fill="#ffffff" fill-opacity="0.035"
          stroke="#ffffff" stroke-opacity="0.14"/>
    <rect x="690" y="44" width="460" height="36" rx="14" fill="#ffffff" fill-opacity="0.05"/>
    <line x1="690" y1="80" x2="1150" y2="80" stroke="#ffffff" stroke-opacity="0.12"/>
    <circle class="live" cx="712" cy="62" r="3.5" fill="#3fb950"/>
    <circle cx="730" cy="62" r="3.5" fill="#ffffff" fill-opacity="0.14"/>
    <circle cx="746" cy="62" r="3.5" fill="#ffffff" fill-opacity="0.14"/>
    <rect x="1082" y="57" width="48" height="10" rx="5" fill="#ffffff" fill-opacity="0.10"/>
  </g>

  <g clip-path="url(#panelClip)">
    <g class="in d4">
      <rect class="bar b1" x="726" y="96"  width="290" height="8" rx="4" fill="url(#accent)" opacity="0.95"/>
      <rect class="bar b2" x="744" y="126" width="176" height="8" rx="4" fill="#58a6ff" opacity="0.55"/>
      <rect class="bar b3" x="734" y="156" width="232" height="8" rx="4" fill="#a371f7" opacity="0.6"/>
      <rect class="bar b4" x="762" y="186" width="112" height="8" rx="4" fill="#f85149" opacity="0.75"/>
      <rect class="bar b5" x="730" y="216" width="252" height="8" rx="4" fill="#58a6ff" opacity="0.45"/>

      <circle cx="712" cy="100" r="3" fill="#58a6ff"/>
      <circle cx="712" cy="130" r="3" fill="#58a6ff"/>
      <circle cx="712" cy="160" r="3" fill="#a371f7"/>
      <circle cx="712" cy="190" r="3" fill="#f85149"/>
      <circle cx="712" cy="220" r="3" fill="#58a6ff"/>
    </g>

    <rect class="sweep" x="700" y="80" width="1.5" height="170" fill="#ffffff" fill-opacity="0.14"/>
  </g>
</svg>
