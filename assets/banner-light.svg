<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="280" viewBox="0 0 1200 280" role="img" aria-labelledby="title">
  <title id="title">Kirill Persionov — Head of Development, .NET</title>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#eef2f8"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0969da"/>
      <stop offset="1" stop-color="#8250df"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#0d1117" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#0969da" stop-opacity="0.11"/>
      <stop offset="1" stop-color="#0969da" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="280" fill="url(#bg)"/>
  <rect width="1200" height="280" fill="url(#grid)"/>
  <ellipse cx="985" cy="140" rx="340" ry="210" fill="url(#glow)"/>

  <!-- typography -->
  <text x="72" y="88" font-family="'Segoe UI',-apple-system,'Helvetica Neue',Arial,sans-serif"
        font-size="13" font-weight="600" letter-spacing="3.4" fill="#0969da">HEAD OF DEVELOPMENT · .NET</text>

  <text x="70" y="152" font-family="'Segoe UI',-apple-system,'Helvetica Neue',Arial,sans-serif"
        font-size="56" font-weight="700" letter-spacing="-1.4" fill="#0d1117">Kirill Persionov</text>

  <text x="72" y="192" font-family="'Segoe UI',-apple-system,'Helvetica Neue',Arial,sans-serif"
        font-size="19" fill="#57606a">12 years of .NET in production — and still shipping</text>

  <rect x="72" y="212" width="168" height="3" rx="1.5" fill="url(#accent)"/>

  <text x="72" y="248" font-family="ui-monospace,SFMono-Regular,Consolas,'Liberation Mono',monospace"
        font-size="13" fill="#6e7781">dotnet add package DotNetScope</text>

  <!-- request waterfall motif -->
  <g stroke="#0d1117" stroke-opacity="0.08" stroke-width="1" stroke-dasharray="2 6">
    <path d="M760 66V232"/><path d="M840 66V232"/><path d="M920 66V232"/><path d="M1000 66V232"/><path d="M1080 66V232"/>
  </g>

  <g>
    <rect x="770" y="92"  width="300" height="10" rx="5" fill="url(#accent)" opacity="0.95"/>
    <rect x="800" y="122" width="190" height="10" rx="5" fill="#0969da" opacity="0.50"/>
    <rect x="790" y="152" width="72"  height="10" rx="5" fill="#0969da" opacity="0.32"/>
    <rect x="830" y="182" width="255" height="10" rx="5" fill="#0969da" opacity="0.65"/>
    <rect x="815" y="212" width="112" height="10" rx="5" fill="#0969da" opacity="0.28"/>
  </g>

  <g fill="#8250df">
    <circle cx="770" cy="97" r="3"/>
    <circle cx="800" cy="127" r="3" opacity="0.7"/>
    <circle cx="790" cy="157" r="3" opacity="0.55"/>
    <circle cx="830" cy="187" r="3" opacity="0.85"/>
    <circle cx="815" cy="217" r="3" opacity="0.5"/>
  </g>
</svg>
